[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devforge-ai"
version = "0.1.0"
description = "A multi-agent system that automatically builds software projects from a natural-language request."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-ollama>=0.3.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
devforge = "main:main"
devforge-server = "server:start"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "main", "server"]

[tool.setuptools.packages.find]
where = ["src"]